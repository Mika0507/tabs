      <h1>Tabs</h1>

              >First Tab</a
            >
          </li>
          <li>
            <a href="#" id="secondTabBtn" onclick="showTab('secondTab')"
              >Second Tab</a
            >
          </li>
          <li>
            <a href="#" id="thirdTabBtn" onclick="showTab('thirdTab')"
              >Third Tab</a

          </li>
          <li>
            <a href="#" id="fourthTabBtn" onclick="showTab('fourthTab')"
              >Fourth Tab</a

        </ul>

    </header>

    <main>
      <p>
        Clicking each tab should hide the content of the other tab and show the
        content of clicked tab. By default, enable the first tab.
      </p>
      <div class="tabs" id="showTab">
        <p>First Tab content.</p>
      </div>
      <div id="cookieConsent">
        <div>
          <img
            class="cookie"
            src="/images/bloqueo-de-cookies.png"
            alt="Cookie Icon"
          />
          <a href="#" onclick="closeTag()"
            ><img class="close" src="/images/cruz.png" alt="Close Icon"
          /></a>
        </div>

        <p>We use cookies to improve your user experience.</p>
        <button class="saveInLocalStorage" onclick="acceptCookies()">
          I like Cookies
        </button>
      </div>
      <section class="message">
        <h2>Write your message:</h2>
        <textarea id="messageTextarea" placeholder="Start typing..." maxlength="200"></textarea>
        <p id="messageCounter"><span id="counter">0</span>/200</p>
      </section>
    </main>
